<div class="comment{{ if .Get "reply" }} comment-reply{{ end }}">
  <img src="{{ .Get "icon" }}" class="comment-avatar" alt="{{ .Get "name" }}">
  <div class="comment-content">
    <div class="comment-meta">
      <span class="comment-author">{{ .Get "name" }}</span>
      <span class="comment-date">{{ .Get "created" }}</span>
    </div>
    <hr class="comment-divider">
    <div class="comment-body">
      {{ .Inner | markdownify }}
    </div>
  </div>
</div>
